# 片库页面 /vod/ 和它的备用地址(启动脚本生成的 vod-backups.conf)都 include 本文件,
# 各自再写 proxy_pass、proxy_ssl_name 和 Host。
# 浏览器校验 Cookie 要原样带给上游,所以不用 proxy-common.conf。几个片库域名认同一个 Cookie。
# js_header_filter 只把校验状态 850 改成 200。
# proxy_set_header 只要在当前层级出现一个,就不再继承上层,所以这里写全。

js_header_filter vod.rewriteStatus;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Referer "https://www.dushe05.com/";
proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
proxy_set_header Cookie $http_cookie;

proxy_ssl_server_name on;
proxy_ssl_protocols TLSv1.2 TLSv1.3;
proxy_ssl_verify off;

proxy_hide_header Set-Cookie;
proxy_hide_header Access-Control-Allow-Origin;
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
add_header Access-Control-Allow-Headers "*" always;
