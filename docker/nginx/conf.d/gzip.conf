# http{} 级别的全局配置(官方镜像 nginx.conf 会 include /etc/nginx/conf.d/*.conf)
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

client_max_body_size 2m;
server_tokens off;
