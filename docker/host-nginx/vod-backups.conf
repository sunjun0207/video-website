# 不用本仓库 Docker 镜像、直接用宿主机 nginx 部署时，给片库加备用域名。
# 片库主地址 www.dushe05.com 回 404 / 5xx 或连不上时，依次改走 www.dushe06.com、www.dushe07.com。
# 三个域名是同一个片库，浏览器解出的校验 Cookie 三个都认，换过去页面上看不出来。
#
# 用法：
#   1. 在现有的 location /api-video-pomelo7-server/vod/ { ... } 里加这三行；
#      里面原来就有 proxy_intercept_errors、recursive_error_pages 或 error_page 的，换成这三行：
#          proxy_intercept_errors on;
#          recursive_error_pages on;
#          error_page 404 500 502 503 504 = @vod_dushe06;
#      recursive_error_pages 不能省：没有它，06 也出错时不会再转到 07。
#   2. 把下面两个 location 原样放进同一个 server { } 里，和上面那个 location 平级。
#   3. nginx -t && nginx -s reload
#
# 主 location 用 rewrite 去掉了前缀，还是靠 proxy_pass 末尾的 / 换掉前缀，这里都能接：没去掉的再去掉一次。

location @vod_dushe06 {
    rewrite ^/api-video-pomelo7-server/vod/?(.*)$ /$1 break;
    proxy_pass https://www.dushe06.com;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host www.dushe06.com;
    proxy_set_header Referer "https://www.dushe05.com/";
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
    proxy_set_header Cookie $http_cookie;
    proxy_ssl_server_name on;
    proxy_ssl_name www.dushe06.com;
    proxy_ssl_verify off;
    proxy_hide_header Set-Cookie;
    proxy_intercept_errors on;
    recursive_error_pages on;
    error_page 404 500 502 503 504 = @vod_dushe07;
}

location @vod_dushe07 {
    rewrite ^/api-video-pomelo7-server/vod/?(.*)$ /$1 break;
    proxy_pass https://www.dushe07.com;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host www.dushe07.com;
    proxy_set_header Referer "https://www.dushe05.com/";
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";
    proxy_set_header Cookie $http_cookie;
    proxy_ssl_server_name on;
    proxy_ssl_name www.dushe07.com;
    proxy_ssl_verify off;
    proxy_hide_header Set-Cookie;
}
